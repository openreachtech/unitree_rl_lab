teacher_model:
  policy:
    MLP:
      extero_encoder:
        # Height scan → exteroceptive latent l_t^e
        shape: [ 80, 60 ]
        activation: leakyrelu
        output: 24

      privileged_encoder:
        # Privileged info: ground friction, contact forces, body velocities, etc.
        shape: [ 64, 32 ]
        activation: leakyrelu
        output: 24        # l_t^p

      base_net:
        # Takes [proprio | extero_latent | priv_latent] → action
        shape: [ 256, 160, 128 ]
        activation: leakyrelu
        # input/output are injected at runtime by TeacherPolicy._adapt()

  critic:
    MLP:
      extero_encoder:
        shape: [ 80, 60 ]
        activation: leakyrelu
        output: 24

      privileged_encoder:
        shape: [ 64, 32 ]
        activation: leakyrelu
        output: 24

      base_net:
        shape: [ 256, 160, 128 ]
        activation: leakyrelu
        # output is forced to 1 (value) by TeacherCritic._adapt()

student_model:
  policy:
    MLP:
      extero_encoder:
        # Single height-map encoder; input = extero_dim (injected by StudentPolicy._adapt)
        shape: [ 80, 60 ]
        activation: leakyrelu
        output: 24
      base_net:
        # Takes [proprio | belief_state] → action
        shape: [ 256, 160, 128 ]
        activation: leakyrelu

  belief_encoder:
    GRU:
      recurrent_encoder:
        # input = proprio_dim + extero_encoder.output  (injected by StudentPolicy._adapt)
        hidden: 50
        num_layers: 2
        batch_first: False
        dropout: 0.
    MLP:
      attention_encoder:
        # Gates the encoded extero latent; output = extero_encoder.output
        shape: [ 64, 64 ]
        activation: leakyrelu
      state_encoder:
        # Compressed belief from GRU; output matches extero_encoder.output
        shape: [ 64, 64 ]
        activation: leakyrelu
        output: 24

  belief_decoder:
    MLP:
      attention_encoder:
        # Gates the raw extero scan; output = extero_dim
        shape: [ 64, 64 ]
        activation: leakyrelu
      extero_decoder:
        # Reconstructs clean exteroception from GRU output; output = extero_dim
        shape: [ 64, 64 ]
        activation: leakyrelu

biped_model:
  # Single actor-critic + auxiliary estimator, trained jointly with PPO.
  # Architecture from: "Learning stable bipedal locomotion skills for quadrupedal
  # robots on challenging terrains with automatic fall recovery" (TumblerNet,
  # Xiao et al., 2025) -- an "Estimator Net" predicts base linear velocity and the
  # CoM-CoP balance vector from a short history of proprioception; its prediction
  # (not the privileged ground truth) is what the actor actually conditions on, so
  # the same network can run at deployment time.
  estimator:
    MLP:
      estimator_mlp:
        # History-of-proprioception -> [lin_vel(3), com_cop(3)].
        shape: [ 256, 128 ]
        activation: relu
        output: 6
        # input is injected at runtime by BipedPolicy._adapt()

  policy:
    MLP:
      base_net:
        # Takes [vel_estimate | proprio(current step) | com_cop_estimate] -> action.
        # Paper: "policy network and critic network are both MLPs with the layer
        # sizes being [512, 256, 128, 12]" -- 12 is the action-dim output layer,
        # so the hidden shape is [512, 256, 128].
        shape: [ 512, 256, 128 ]
        activation: elu
        # input/output are injected at runtime by BipedPolicy._adapt()

  critic:
    MLP:
      base_net:
        # Takes the full privileged critic observation (includes ground-truth
        # lin_vel / com_cop) -> value. Never seen by the actor. Same [512, 256, 128]
        # hidden shape as the policy net (see note above).
        shape: [ 512, 256, 128 ]
        activation: elu
        # input/output are injected at runtime by BipedCritic._adapt()
