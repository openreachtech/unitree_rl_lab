# Robot-agnostic Nav2 configuration for the VLFM nav stack (M3).
#
# Robot-specific values -- robot_base_frame, footprint, velocity limits -- live in
# the robot overlay (e.g. go2_nav_bringup/params/nav2_go2.yaml), loaded AFTER this
# file so its keys win. Values here assume:
#   /map from slam_toolbox (mapping mode, map->odom TF), /scan from
#   pointcloud_to_laserscan, odom->base TF from the robot layer, and a low-level
#   controller consuming /cmd_vel.
#
# Controller: MPPI in DiffDrive mode (2026-09-30). Omni was dropped because the
# footprint is 0.80 x 0.40 m: moving forward sweeps 0.40 m, moving sideways sweeps
# 0.80 m -- wider than an interior doorway. MPPI could not know that, because
# ObstaclesCritic runs with consider_footprint: false, i.e. the robot is a point
# against an isotropic inflation, so heading has zero effect on obstacle cost. The
# result was observed repeatedly: the robot crabs sideways into a door frame and
# jams. DiffDrive drops vy from the sampled controls; vx and wz are still sampled
# independently, so forward-while-turning arcs (the normal way it trims onto the
# path) are unaffected -- only pure strafing is gone.

controller_server:
  ros__parameters:
    # 10 Hz: enough for a velocity-interface quadruped, and this MPPI shares the
    # CPU with Isaac Sim -- at 20 Hz it managed ~9 Hz with 0.27 s gaps.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      # Generous: a legged robot climbing a step can be legitimately slow.
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      # keep equal to the exploration layer's goal_reached_m (its proximity
      # arrival would otherwise never fire / fire after this one inconsistently)
      xy_goal_tolerance: 0.15
      # Position-only goals: exploration cares where the robot stands, not which way
      # it faces, and a quadruped takes 5-15 s to fine-rotate onto an (arbitrary)
      # goal heading at every single frontier. 2*pi = any yaw passes.
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30
      model_dt: 0.1 # must equal the 10 Hz controller period
      # 100, down from 800 (Nav2's default is 2000), to pay for consider_footprint on a
      # machine that is already short of CPU. MPPI is a sampling optimiser: this is how
      # many candidate velocity sequences it scores per cycle, so fewer samples cover the
      # control space more thinly. Worth knowing which way that cuts here -- threading a
      # chair-to-wall slot is a narrow solution, exactly the kind a thin sample set can
      # miss, and the symptom would be the same stall this change exists to fix. If the
      # robot still balks at gaps, raise this before suspecting anything else.
      batch_size: 100
      vx_std: 0.2
      vy_std: 0.15
      wz_std: 0.35
      # Envelope defaults; the robot overlay sets the policy's real limits.
      vx_max: 0.5
      vx_min: -0.2
      vy_max: 0.0 # DiffDrive: no lateral control (see header)
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
        [
          "ConstraintCritic",
          "ObstaclesCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: false # position-only goals (see general_goal_checker.yaw_goal_tolerance)
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        # true since 2026-10-02. With the circular approximation MPPI has no idea the
        # robot is narrow end-on, so a gap it fits through lengthwise still reads as
        # expensive inflated space from the centre point alone -- and with
        # critical_weight 20 against PreferForward's 3, standing still wins. Observed
        # directly: a path was planned through the slot between a chair and a wall and
        # the robot stopped in front of it and marched on the spot. Nav2 flags the same
        # thing at startup ("Inconsistent configuration in collision checking").
        # Checking the real rectangle costs CPU, which this machine is short of -- drop
        # batch_size if the controller stops making its 10 Hz.
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.40
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.6
      PathAngleCritic:
        # Under DiffDrive this is the only thing that can turn the robot onto the
        # path, but keep the weight low: raising it biases toward stop-and-rotate
        # and suppresses the forward-while-turning arcs we actually want. It stays
        # dormant until the heading error exceeds max_angle_to_furthest anyway.
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      # Exploration plans into space SLAM has not seen yet.
      allow_unknown: true

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link # overlay
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

# NO behavior_server. nav.launch.py does not run the node (its lifecycle-race failure
# to activate used to block bt_navigator), and both default BTs are overridden with
# fail-fast trees whose only recovery is clearing the costmaps -- a service, not a
# behavior. The exploration layer owns real failure handling: blacklist plus a
# displacement-verified ESCAPE. Its config block lived here until 2026-10-02, doing
# nothing; if the node ever comes back, so should the block.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link # overlay
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # footprint: overlay
      plugins: ["obstacle_layer", "contact_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # scan marks and clears (dense angular rays); cloud additionally marks --
        # the height-filtered point cloud hits thin obstacles (chair legs, window
        # sills) that the laser's one-return-per-azimuth-bin can miss. Cloud marks
        # have no raytrace clearing of their own, but here that is bounded: scan
        # raytrace clears them, and the rolling window drops whatever it misses.
        observation_sources: scan cloud
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
        cloud:
          topic: /utlidar/cloud_band
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: -10.0 # the band topic is already height-filtered
          max_obstacle_height: 10.0
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
      contact_layer:
        # Physical-contact evidence from the exploration layer (/vlfm/contact_obstacles):
        # spots where the robot verifiably could not move -- glass, sills below the
        # scan band, thin shelves. Its own layer, marking only: mixed into the scan
        # layer, scan raytrace would erase these (rays pass straight through glass).
        # obstacle_max_range is from the message frame's origin (map), hence large.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: contacts
        contacts:
          topic: /vlfm/contact_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link # overlay
      rolling_window: false
      track_unknown_space: true
      # footprint: overlay
      # NO scan-fed obstacle_layer here, deliberately (2026-09-25). The global costmap keeps
      # its marks in a fixed map-frame grid, but slam_toolbox keeps correcting
      # map->odom: after every correction the old marks sit at now-wrong positions,
      # and cells no ray happens to cross again are never cleared. Over a long run
      # this painted ~52 m^2 of map-free space lethal and sealed the robot inside a
      # phantom 1.5 m^2 pocket (planner: "failed to create plan" from open floor).
      # The SLAM map itself stays clean -- scans are re-integrated through the
      # re-optimized pose graph -- so the static layer is the only trustworthy
      # long-lived obstacle source. Live obstacles are the local costmap's job.
      # contact_layer is the one exception: a handful of deliberate, physically
      # verified marks with no raytrace churn -- the staleness spiral above cannot
      # start from those, and the planner MUST route around them (they are exactly
      # the obstacles no scan will ever show).
      plugins: ["static_layer", "contact_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      contact_layer:
        # Physical-contact evidence from the exploration layer (/vlfm/contact_obstacles):
        # spots where the robot verifiably could not move -- glass, sills below the
        # scan band, thin shelves. Its own layer, marking only: mixed into the scan
        # layer, scan raytrace would erase these (rays pass straight through glass).
        # obstacle_max_range is from the message frame's origin (map), hence large.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: contacts
        contacts:
          topic: /vlfm/contact_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 100.0
          raytrace_max_range: 100.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
