# RKO-LIO on the Go2 sim bridge topics -- the deployment-matching odometry path
# (both the Go2 height-map stack and Anaguma run RKO-LIO on hardware).
#
# Everything lives in this file (topics included): rko_lio's launch only accepts
# per-parameter overrides from its own command line (it reads context.argv), so
# arguments forwarded by an IncludeLaunchDescription are ignored -- config_file is
# the one input that passes through. Extrinsics come from TF: robot_state_publisher
# provides base->radar (lidar) and base->imu from go2.urdf.

imu_topic: /sim/imu
lidar_topic: /utlidar/cloud
base_frame: base
autodetect: false
rviz: false

odom_topic: /odometry/filtered # the robot-layer contract topic
odom_frame: odom
publish_local_map: false
publish_deskewed_scan: false

# The sim cloud is already motion-corrected into the end-of-sweep pose and carries
# no per-point timestamps -- deskewing is neither possible nor needed.
deskew: false
# ON: 2 threads then 6 both processed 10 Hz clouds at only 3.8 Hz; every dropped
# frame during motion (worst: the initial 360 spin) registers returns at a lagged
# pose and sprinkles phantom occupied cells -- including onto the floor around
# the robot, whose inflated cost then kills the planner start (2026-09-29).
double_downsample: true
# OFF, deliberately (2026-09-28). The init phase estimates the accel/gyro bias
# from the ~3 IMU samples between the first two scans, assuming the robot is
# static -- and that window lands exactly in the ROS-launch CPU spike. One dirty
# sample gives a catastrophic bias (observed: z bias 7.88 m/s^2 = half of
# gravity absorbed as "bias"), a tilted odometry, and a shredded SLAM map.
# The sim IMU has NO true bias (gravity + finite difference, no bias term), so
# skipping estimation starts at the exact truth. A REAL robot (Anaguma overlay)
# should keep this true -- its IMU bias is real.
initialization_phase: false
voxel_size: 0.3 # indoor rooms; the 1.0 default is outdoor scale
min_range: 0.3
# 15 m covers the longest indoor sight line in kujiale (16x14 m flat); 20 m only
# added registration cost for stray far returns.
max_range: 15.0
# 2 threads processed 10 Hz clouds at only 3.8 Hz once the robot cruised at
# ~1 m/s (Phase1, no deadband lift): 60% of frames dropped, odometry undershot
# real motion by ~1/3 and the SLAM map compressed/warped (measured 2026-09-28).
# The box has 20 cores at load ~4; give the odometry what it needs.
max_num_threads: 6
