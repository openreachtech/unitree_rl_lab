# Go2 robot-layer contract (doc/design/vlfm_nav.md §3).
# Everything robot-specific the shared VLFM/Nav stack needs lives here; an Anaguma
# port supplies its own copy of this file and nothing else changes.

/**:
  ros__parameters:
    robot:
      base_frame: "base"        # go2.urdf root link (inekf publishes odom->base)
      odom_frame: "odom"
      lidar_frame: "radar"      # L1 mount link in go2.urdf; sim cloud is stamped with it

    topics:
      pointcloud: "/utlidar/cloud" # full returns -- RKO-LIO input
      pointcloud_band: "/utlidar/cloud_band" # height-band subset -- pointcloud_to_laserscan input
      odometry: "/odometry/filtered"
      cmd_vel: "/cmd_vel"

    # Policy training envelope (Go2-Blind-GRU-Phase4 limit_ranges). Nav2's velocity
    # limits and any /cmd_vel clamping must stay inside these.
    cmd_limits:
      lin_vel_x: [-1.0, 1.0]
      lin_vel_y: [-0.4, 0.4]
      ang_vel_z: [-1.0, 1.0]

    # Footprint (m): body ~0.70 x 0.31 plus margin.
    #
    # 0.80 x 0.40 since 2026-10-02, down from 0.85 x 0.45. The old width put the
    # inscribed radius at 0.225 m, so Nav2 treated anything inside 0.225 m of an
    # obstacle as untraversable and a gap had to clear 0.45 m before a path could even
    # exist. Observed: the robot stalled in front of the slot between a chair and a wall
    # and marched in place. 0.40 still leaves 9 cm of margin on a 31 cm body.
    footprint:
      length: 0.80
      width: 0.40

    # pointcloud_to_laserscan z band, in base_frame coordinates. Deliberately wide:
    # the real height selection happens upstream in a gravity-aligned frame (sim:
    # play_ros2.py --cloud_z_band, world z 0.15-0.85 m -- floor at 0.15 assuming a
    # flat-ground policy: anything taller is a wall. (History: 0.30 for clean-step
    # climbing, 0.20 after a sofa seat defeated it, 0.15 for flat-walking policies;
    # real robot: RKO-LIO-posed filter),
    # because a base-frame band tilts with body pitch and leaks far ground returns
    # past walls. This band only cuts gross outliers that survive that filter.
    scan_band:
      min_height: -0.4
      max_height: 0.7
